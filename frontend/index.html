<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QMS 问题解决管理系统</title>
    <script>
      // Apply the saved density / language before first paint so there is no flash.
      try {
        var d = localStorage.getItem('qms.density')
        if (d) document.documentElement.dataset.density = d
      } catch (e) { /* private mode */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
